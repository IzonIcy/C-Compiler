name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [clang, gcc]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run tests
        run: make clean && make test CC=${{ matrix.cc }}

  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run static analysis
        run: make analyze ANALYZER=clang

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run sanitizer tests
        run: make sanitizers CC=clang

  werror:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and test with warnings as errors
        run: make clean && make test CC=clang CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror"

  fuzz:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build libFuzzer harness
        run: make fuzz-libfuzzer CC=clang

      - name: Build parser-recovery harness
        run: make fuzz-parse-libfuzzer CC=clang

      - name: Seed corpus and smoke-run fuzzer
        env:
          # Huge allocations from adversarial input return NULL (exercising the
          # compiler's OOM path) instead of ASan aborting the whole run.
          ASAN_OPTIONS: allocator_may_return_null=1
        run: |
          mkdir -p build/fuzz-corpus
          cp examples/*.c tests/*.c build/fuzz-corpus/
          ./build/bin/fuzz-pipeline -max_total_time=30 -timeout=5 -print_final_stats=1 -rss_limit_mb=2048 build/fuzz-corpus

      - name: Fuzz the standalone parser harness
        env:
          ASAN_OPTIONS: allocator_may_return_null=1
        run: |
          # The pipeline harness skips inputs that fail preprocessing/lexing,
          # so parser error-recovery only gets exercised here.
          mkdir -p build/fuzz-parse-corpus
          cp examples/*.c tests/*.c build/fuzz-parse-corpus/
          ./build/bin/fuzz-parse-libfuzzer -max_total_time=30 -timeout=5 -print_final_stats=1 -rss_limit_mb=2048 build/fuzz-parse-corpus
